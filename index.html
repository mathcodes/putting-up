<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0d1f17" />
<title>Putting Up — APA 23 Rule Tracker</title>
<style>
  :root {
    --bg: #0b1712; --panel: #12241c; --panel2: #183026; --line: #24453a;
    --text: #e8f1ec; --muted: #8fb0a2; --felt: #2fae6e; --felt-dim: #1d6b45;
    --warn: #f0b429; --bad: #e5484d; --bad-bg: #3a1517; --played: #3b4a44;
    --a: #4ea8ff; --b: #ff8a3d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(11,23,18,.96);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
    padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .3px; flex: 1 1 auto; }
  h1 span { color: var(--felt); }
  .ctl { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
  .ctl select, .ctl input { background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 8px; }
  .ctl input { width: 56px; }
  .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 12px; cursor: pointer; }
  .btn:hover { border-color: var(--felt-dim); }
  .btn.danger { border-color: #5a2427; color: #ffb3b5; }
  .btn.small { padding: 4px 9px; font-size: 13px; border-radius: 8px; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px; display: grid; gap: 12px; }

  /* Scoreboard */
  .board { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 12px; border-top: 4px solid var(--c); }
  .tcard input.tname { background: transparent; border: 0; font-weight: 700; font-size: 16px;
    width: 100%; padding: 0; color: var(--c); }
  .sum { display: flex; align-items: baseline; gap: 6px; margin-top: 4px; }
  .sum b { font-size: 34px; font-variant-numeric: tabular-nums; line-height: 1; }
  .sum small { color: var(--muted); }
  .bar { height: 10px; background: var(--panel2); border-radius: 6px; overflow: hidden; margin: 8px 0 6px; }
  .bar > i { display: block; height: 100%; background: var(--felt); transition: width .25s; }
  .bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
  .stats b { color: var(--text); }
  .alert { margin-top: 6px; font-size: 13px; padding: 5px 8px; border-radius: 8px;
    background: var(--bad-bg); color: #ffb3b5; }

  /* Matches */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
    margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .match { display: grid; grid-template-columns: 54px 1fr 26px 1fr; gap: 6px; align-items: center;
    padding: 5px 0; border-top: 1px solid var(--line); }
  .match:first-of-type { border-top: 0; }
  .mnum { font-size: 12px; color: var(--muted); line-height: 1.1; }
  .mnum b { display: block; font-size: 15px; color: var(--text); }
  .mnum em { font-style: normal; font-size: 11px; }
  .vs { text-align: center; color: var(--muted); font-size: 12px; }
  .slot { min-height: 42px; border: 1px dashed var(--line); border-radius: 10px; padding: 6px 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 6px; cursor: pointer;
    background: transparent; text-align: left; width: 100%; }
  .slot.filled { border-style: solid; background: var(--panel2); border-color: var(--c); }
  .slot.target { border: 2px solid var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }
  .slot .ph { color: var(--muted); font-size: 13px; }
  .slot .x { color: var(--muted); font-size: 18px; line-height: 1; padding: 0 2px; }
  .sl { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 50%;
    background: var(--felt-dim); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; flex: none; }

  /* Rosters */
  .rosters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .roster { border-top: 4px solid var(--c); }
  .plist { display: grid; gap: 6px; }
  .p { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 10px;
    background: var(--panel2); border: 1px solid var(--line); cursor: pointer; width: 100%; text-align: left; }
  .p:hover:not(:disabled) { border-color: var(--c); }
  .p .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .p .tag { font-size: 11px; padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
  .p.ok .tag { background: #173d2b; color: #8fe3b6; }
  .p.red { background: var(--bad-bg); border-color: #6b2226; cursor: not-allowed; }
  .p.red .nm { color: #ffb3b5; text-decoration: line-through; text-decoration-color: rgba(229,72,77,.6); }
  .p.red .sl { background: var(--bad); }
  .p.red .tag { background: var(--bad); color: #fff; }
  .p.played { opacity: .45; cursor: default; background: var(--played); }
  .p.played .tag { background: #26332e; color: var(--muted); }
  .p.out .tag { background: #26332e; color: var(--muted); }
  .p.out { opacity: .55; }
  .del, .sit { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 3px; font-size: 13px; flex: none; opacity: .7; }
  .del:hover, .sit:hover { opacity: 1; }
  .addrow { display: flex; gap: 6px; margin-top: 8px; }
  .addrow input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; min-width: 0; }
  .addrow input.n { flex: 1; } .addrow input.s { width: 58px; }
  .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  #dlg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; place-items: center; z-index: 20; padding: 16px; }
  #dlg.on { display: grid; }
  #dlg .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; max-width: 340px; width: 100%; }
  #dlg .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 0 24px; }

  @media (max-width: 640px) {
    body { font-size: 14px; }
    .match { grid-template-columns: 40px 1fr 16px 1fr; gap: 4px; }
    .sum b { font-size: 28px; }
    .p { padding: 7px 6px; gap: 6px; }
    .p .tag { font-size: 10px; padding: 2px 4px; }
    .rosters, .board { gap: 8px; }
    .panel, .tcard { padding: 8px; }
  }
</style>
</head>
<body>
<header>
  <h1>Putting <span>Up</span></h1>
  <label class="ctl">Format
    <select id="fmt">
      <option value="9">9-Ball (SL 1–9)</option>
      <option value="8">8-Ball (SL 2–7)</option>
    </select>
  </label>
  <label class="ctl">Cap <input id="cap" type="number" min="1" max="50" /></label>
  <label class="ctl">Matches <input id="nmatch" type="number" min="1" max="7" /></label>
  <button class="btn small" id="swap" title="Swap which team puts up first">⇄ First up</button>
  <button class="btn small danger" id="reset" title="Clear tonight's matches, keep rosters">New night</button>
</header>

<main>
  <section class="board" id="board"></section>
  <section class="panel">
    <h2>Lineup <span class="legend">
      <span><i style="background:#173d2b"></i>can play</span>
      <span><i style="background:var(--bad)"></i>would break cap</span>
      <span><i style="background:var(--played)"></i>already played</span>
    </span></h2>
    <div id="matches"></div>
    <p class="hint">Tap a player below to put them up in the highlighted slot. Tap a slot to target it; tap ✕ to clear.</p>
  </section>
  <section class="rosters" id="rosters"></section>
  <footer>Ineligible = their SL plus the cheapest possible fill for the remaining slots would exceed the cap.</footer>
</main>
<div id="dlg" role="dialog" aria-modal="true"><div class="box"><div id="dlgmsg"></div>
  <div class="row"><button class="btn small" id="dlgno">Cancel</button><button class="btn small danger" id="dlgyes">OK</button></div></div></div>

<script>
(() => {
  const KEY = 'putting-up:v1';
  const FMT = { '9': { min: 1, max: 9 }, '8': { min: 2, max: 7 } };
  const uid = () => Math.random().toString(36).slice(2, 9);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  const fresh = () => ({
    format: '9', cap: 23, nMatches: 5, firstUp: 0,
    teams: [
      { name: 'Home', players: [] },
      { name: 'Away', players: [] },
    ],
    matches: Array.from({ length: 5 }, () => [null, null]),
    target: [0, 0],
  });

  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch { S = fresh(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

  // ---------- core rule logic ----------
  const playerById = (t, id) => S.teams[t].players.find(p => p.id === id);
  const pickedIds = t => S.matches.map(m => m[t]).filter(Boolean);
  const teamSum = t => pickedIds(t).reduce((a, id) => a + (playerById(t, id)?.sl || 0), 0);
  const slotsLeft = t => S.matches.filter(m => !m[t]).length;
  const available = t => {
    const used = new Set(pickedIds(t));
    return S.teams[t].players.filter(p => !used.has(p.id) && !p.out);
  };
  // smallest sum of k skill levels from list (missing players = forfeits, count 0)
  const cheapest = (list, k) => list.map(p => p.sl).sort((a, b) => a - b).slice(0, Math.max(0, k)).reduce((a, b) => a + b, 0);

  function eligibility(t) {
    const sum = teamSum(t), left = slotsLeft(t), avail = available(t);
    const res = new Map();
    for (const p of avail) {
      const others = avail.filter(o => o !== p);
      const floor = sum + p.sl + cheapest(others, left - 1);
      res.set(p.id, { ok: left > 0 && floor <= S.cap, floor });
    }
    // highest SL that could still go in the next slot
    const okSLs = avail.filter(p => res.get(p.id).ok).map(p => p.sl);
    const maxNext = okSLs.length ? Math.max(...okSLs) : null;
    const stuck = left > 0 && avail.length > 0 && okSLs.length === 0;
    return { sum, left, res, maxNext, stuck, roomLeft: S.cap - sum };
  }

  function ensureMatches() {
    const n = Math.min(7, Math.max(1, S.nMatches | 0 || 5));
    S.nMatches = n;
    while (S.matches.length < n) S.matches.push([null, null]);
    if (S.matches.length > n) S.matches.length = n;
  }
  function fixTarget(t) {
    const cur = S.target[t];
    if (cur == null || cur >= S.matches.length || S.matches[cur][t]) {
      const i = S.matches.findIndex(m => !m[t]);
      S.target[t] = i === -1 ? null : i;
    }
  }

  // ---------- render ----------
  const colors = ['var(--a)', 'var(--b)'];
  const $ = id => document.getElementById(id);

  function render() {
    ensureMatches(); fixTarget(0); fixTarget(1);
    $('fmt').value = S.format; $('cap').value = S.cap; $('nmatch').value = S.nMatches;
    const E = [eligibility(0), eligibility(1)];

    // board
    $('board').innerHTML = [0, 1].map(t => {
      const e = E[t], pct = Math.min(100, (e.sum / S.cap) * 100);
      const cls = e.sum > S.cap ? 'bad' : e.roomLeft <= 4 + e.left ? 'warn' : '';
      return `<div class="tcard" style="--c:${colors[t]}">
        <input class="tname" data-t="${t}" value="${esc(S.teams[t].name)}" aria-label="Team name" />
        <div class="sum"><b>${e.sum}</b><small>/ ${S.cap}</small></div>
        <div class="bar ${cls}"><i style="width:${pct}%"></i></div>
        <div class="stats">
          <span>Room <b>${e.roomLeft}</b></span>
          <span>Slots left <b>${e.left}</b></span>
          <span>Max next SL <b>${e.left ? (e.maxNext ?? '—') : '—'}</b></span>
        </div>
        ${e.sum > S.cap ? `<div class="alert">Over the cap by ${e.sum - S.cap}!</div>` : ''}
        ${e.stuck ? `<div class="alert">No available player fits — lineup can't be completed under ${S.cap}.</div>` : ''}
        ${e.left && available(t).length < e.left ? `<div class="alert">Only ${available(t).length} player(s) left for ${e.left} slot(s) — forfeit risk.</div>` : ''}
      </div>`;
    }).join('');

    // matches
    $('matches').innerHTML = S.matches.map((m, i) => {
      const first = (S.firstUp + i) % 2;
      const cell = t => {
        const p = m[t] && playerById(t, m[t]);
        const tgt = S.target[t] === i ? 'target' : '';
        return p
          ? `<div class="slot filled ${tgt}" style="--c:${colors[t]}" data-slot="${t}:${i}">
               <span class="sl">${p.sl}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span>
               <span class="x" data-clear="${t}:${i}" title="Clear">✕</span></div>`
          : `<button class="slot ${tgt}" style="--c:${colors[t]}" data-slot="${t}:${i}"><span class="ph">${tgt ? '▶ next pick' : 'open'}</span></button>`;
      };
      return `<div class="match">
        <div class="mnum"><b>#${i + 1}</b><em style="color:${colors[first]}">${esc(S.teams[first].name).slice(0, 8)} up</em></div>
        ${cell(0)}<div class="vs">vs</div>${cell(1)}
      </div>`;
    }).join('');

    // rosters
    const f = FMT[S.format];
    $('rosters').innerHTML = [0, 1].map(t => {
      const e = E[t], used = new Set(pickedIds(t));
      const players = [...S.teams[t].players].sort((a, b) => b.sl - a.sl || a.name.localeCompare(b.name));
      const rows = players.map(p => {
        if (used.has(p.id)) {
          const mi = S.matches.findIndex(m => m[t] === p.id) + 1;
          return `<div class="p played"><span class="sl">${p.sl}</span><span class="nm">${esc(p.name)}</span><span class="tag">played #${mi}</span></div>`;
        }
        if (p.out) {
          return `<div class="p out"><span class="sl">${p.sl}</span><span class="nm">${esc(p.name)}</span><span class="tag">not here</span>
            <button class="sit" data-sit="${t}:${p.id}" title="Mark present">↩</button>
            <button class="del" data-del="${t}:${p.id}" title="Remove">🗑</button></div>`;
        }
        const r = e.res.get(p.id);
        const ok = r && r.ok;
        const tag = !e.left ? 'done' : ok ? 'can play' : `too high (${r.floor}>${S.cap})`;
        return `<div style="display:flex;gap:4px;align-items:center">
          <button class="p ${ok ? 'ok' : 'red'}" style="--c:${colors[t]}" data-pick="${t}:${p.id}" ${ok ? '' : 'disabled'}
            title="${ok ? 'Put up' : `Min possible total would be ${r.floor}`}">
            <span class="sl">${p.sl}</span><span class="nm">${esc(p.name)}</span><span class="tag">${tag}</span>
          </button>
          <button class="sit" data-sit="${t}:${p.id}" title="Mark not here tonight">💤</button>
          <button class="del" data-del="${t}:${p.id}" title="Remove from roster">🗑</button>
        </div>`;
      }).join('') || `<p class="hint">No players yet — add your roster below.</p>`;
      return `<div class="panel roster" style="--c:${colors[t]}">
        <h2><span style="color:${colors[t]}">${esc(S.teams[t].name)}</span><span>${S.teams[t].players.length}/8</span></h2>
        <div class="plist">${rows}</div>
        <form class="addrow" data-add="${t}">
          <input class="n" name="n" placeholder="Player name" required maxlength="30" />
          <input class="s" name="s" type="number" placeholder="SL" min="${f.min}" max="${f.max}" required />
          <button class="btn small" type="submit">Add</button>
        </form>
      </div>`;
    }).join('');
    save();
  }

  // in-page confirm dialog (window.confirm is blocked in sandboxed frames)
  function ask(msg, yes = 'OK') {
    return new Promise(res => {
      const d = $('dlg'); $('dlgmsg').textContent = msg; $('dlgyes').textContent = yes; d.classList.add('on');
      const done = v => { d.classList.remove('on'); $('dlgyes').onclick = $('dlgno').onclick = null; res(v); };
      $('dlgyes').onclick = () => done(true); $('dlgno').onclick = () => done(false);
    });
  }

  // ---------- events ----------
  document.addEventListener('click', async ev => {
    const el = ev.target.closest('[data-clear],[data-slot],[data-pick],[data-del],[data-sit]');
    if (!el) return;
    if (el.dataset.clear) {
      ev.stopPropagation();
      const [t, i] = el.dataset.clear.split(':').map(Number);
      S.matches[i][t] = null; S.target[t] = i;
    } else if (el.dataset.slot) {
      const [t, i] = el.dataset.slot.split(':').map(Number);
      S.target[t] = i;
    } else if (el.dataset.pick) {
      const [ts, id] = el.dataset.pick.split(':'); const t = +ts;
      const i = S.target[t];
      if (i == null) return;
      S.matches[i][t] = id; S.target[t] = null;
    } else if (el.dataset.sit) {
      const [ts, id] = el.dataset.sit.split(':');
      const p = playerById(+ts, id); if (p) p.out = !p.out;
    } else if (el.dataset.del) {
      const [ts, id] = el.dataset.del.split(':'); const t = +ts;
      const p = playerById(t, id);
      if (!p || !(await ask(`Remove ${p.name} from the roster?`, 'Remove'))) return;
      S.teams[t].players = S.teams[t].players.filter(x => x.id !== id);
      S.matches.forEach(m => { if (m[t] === id) m[t] = null; });
    }
    render();
  });

  document.addEventListener('submit', async ev => {
    const form = ev.target.closest('[data-add]'); if (!form) return;
    ev.preventDefault();
    const t = +form.dataset.add, f = FMT[S.format];
    const name = form.n.value.trim(), sl = parseInt(form.s.value, 10);
    if (!name || isNaN(sl) || sl < f.min || sl > f.max) return;
    if (S.teams[t].players.length >= 8 && !(await ask('APA rosters max out at 8. Add anyway?', 'Add'))) return;
    S.teams[t].players.push({ id: uid(), name, sl });
    render();
    document.querySelector(`[data-add="${t}"] input.n`)?.focus();
  });

  document.addEventListener('change', ev => {
    if (ev.target.classList.contains('tname')) { S.teams[+ev.target.dataset.t].name = ev.target.value.trim() || 'Team'; render(); }
  });
  $('fmt').onchange = e => { S.format = e.target.value; render(); };
  $('cap').onchange = e => { S.cap = Math.max(1, parseInt(e.target.value, 10) || 23); render(); };
  $('nmatch').onchange = e => { S.nMatches = parseInt(e.target.value, 10) || 5; render(); };
  $('swap').onclick = () => { S.firstUp = 1 - S.firstUp; render(); };
  $('reset').onclick = async () => {
    if (!(await ask('Start a new night? Clears all matches and "not here" flags; rosters are kept.', 'New night'))) return;
    S.matches = Array.from({ length: S.nMatches }, () => [null, null]);
    S.teams.forEach(tm => tm.players.forEach(p => delete p.out));
    S.target = [0, 0];
    render();
  };

  // expose pure logic for tests
  window.__PU = { get state() { return S; }, set state(v) { S = v; }, eligibility, render };
  render();
})();
</script>
</body>
</html>
